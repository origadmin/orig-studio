# taxonomy.yaml — 分类/标签权威种子数据源（source of truth）
#
# GOV-STD-URL D1/D3/D4（portal-filter-url-seed-redesign.md §3）：
#   - slug 为稳定键（^[a-z0-9_-]+$，§3.7 强制，非 ASCII 直接启动失败）
#   - DB 是运行时存储，本文件是权威源；启动时按 slug 幂等 upsert（Tags 由 skip 改校正）
#   - *_i18n 列保留为统一翻译表预留位，本文件不写内联翻译（§9-5）
#   - 现有 DB 中未列出的分类/tag 保留不删（防误删引用数据）
#
# 类别模型（BUG-145 + BUG-162，2026-08-26 最终定稿）：
#   - 三模块根：video / music / article（共享分类表锚点，靠树位置区分模块）
#   - 3 级分层（root → L2 分类 → L3 子分类）：
#       · L1 = 类型：视频 / 音乐 / 文章（主页横条只摆这 3 个，结构简单不溢出）
#       · L2 = 真实内容分类（连续剧/电影/综艺/动漫/MV/纪录片/游戏/体育/娱乐/
#             科技/教程/生活/宣传片/UGC/其他），共 15 个
#       · L3 = 子分类叶子，共 50 个
#   - 「形式 / 题材」双轴抽象已废弃（2026-08-26 用户拍板）：类型才是真正的"类型"，
#     分类是真实内容类别，二者都不该作为 UI 轴标签。3 级树只为把长列表收进可展开组，
#     解决主页/分类页"分类太长显示不下"的核心问题。
#   - kind 字段已移除：不再有 form/genre 划分，分类纯按树层级组织。
#     video 根下 L2 分类全量 = 15，每个展开 >=1 L3 叶子（2 展开 3）。任何改动须经
#     bug/design-change 流程并写追溯日志（AGENTS.md 规则 #10 R-D2）。
