// ========== Playlist Service ==========

service PlaylistService {
  rpc GetPlaylists(GetPlaylistsRequest) returns (GetPlaylistsResponse) {
    option (google.api.http) = {get: "/api/v1/playlists"};
  }
  rpc GetPlaylist(GetPlaylistRequest) returns (GetPlaylistResponse) {
    option (google.api.http) = {get: "/api/v1/playlists/{short_token}"};
  }
  rpc CreatePlaylist(CreatePlaylistRequest) returns (CreatePlaylistResponse) {
    option (google.api.http) = {
      post: "/api/v1/playlists"
      body: "*"
    };
  }
  rpc UpdatePlaylist(UpdatePlaylistRequest) returns (UpdatePlaylistResponse) {
    option (google.api.http) = {
      put: "/api/v1/playlists/{playlist.id}"
      body: "*"
    };
  }
  rpc DeletePlaylist(DeletePlaylistRequest) returns (DeletePlaylistResponse) {
    option (google.api.http) = {delete: "/api/v1/playlists/{id}"};
  }
  rpc AddPlaylistMedia(AddPlaylistMediaRequest) returns (AddPlaylistMediaResponse) {
    option (google.api.http) = {
      post: "/api/v1/playlists/{playlist_id}/medias"
      body: "*"
    };
  }
  rpc ReorderPlaylistMedia(ReorderPlaylistMediaRequest) returns (ReorderPlaylistMediaResponse) {
    option (google.api.http) = {
      put: "/api/v1/playlists/{playlist_id}/medias/reorder"
      body: "*"
    };
  }
  rpc RemovePlaylistMedia(RemovePlaylistMediaRequest) returns (RemovePlaylistMediaResponse) {
    option (google.api.http) = {
      delete: "/api/v1/playlists/{playlist_id}/medias/{media_id}"
    };
  }

  // My playlist routes
  rpc ListMyPlaylists(ListMyPlaylistsRequest) returns (ListMyPlaylistsResponse) {
    option (google.api.http) = {get: "/api/v1/me/playlists"};
  }
  rpc CreateMyPlaylist(CreateMyPlaylistRequest) returns (CreateMyPlaylistResponse) {
    option (google.api.http) = {
      post: "/api/v1/me/playlists"
      body: "*"
    };
  }
  rpc UpdateMyPlaylist(UpdateMyPlaylistRequest) returns (UpdateMyPlaylistResponse) {
    option (google.api.http) = {
      patch: "/api/v1/me/playlists/{id}"
      body: "*"
    };
  }
  rpc DeleteMyPlaylist(DeleteMyPlaylistRequest) returns (DeleteMyPlaylistResponse) {
    option (google.api.http) = {delete: "/api/v1/me/playlists/{id}"};
  }
  rpc AddMyPlaylistMedia(AddMyPlaylistMediaRequest) returns (AddMyPlaylistMediaResponse) {
    option (google.api.http) = {
      post: "/api/v1/me/playlists/{id}/media"
      body: "*"
    };
  }
  rpc RemoveMyPlaylistMedia(RemoveMyPlaylistMediaRequest) returns (RemoveMyPlaylistMediaResponse) {
    option (google.api.http) = {delete: "/api/v1/me/playlists/{id}/media/{media_id}"};
  }
  rpc ReorderMyPlaylistMedia(ReorderMyPlaylistMediaRequest) returns (ReorderMyPlaylistMediaResponse) {
    option (google.api.http) = {
      patch: "/api/v1/me/playlists/{id}/media/reorder"
      body: "*"
    };
  }
}

