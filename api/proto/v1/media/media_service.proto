syntax = "proto3";

package api.v1.services.media;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "v1/types/media.proto";
import "v1/types/user.proto";

option go_package = "origadmin/application/origstudio/api/gen/v1/media;media";
option java_multiple_files = true;
option java_outer_classname = "OrigStudioServiceMediaProto";
option java_package = "com.origstudio.api.v1.services.media";
option objc_class_prefix = "OrigStudioMedia";

// The media service definition.
service MediaService {
  // ========== Media CRUD ==========

  // ListMedias returns a list of medias.
  rpc ListMedias(ListMediasRequest) returns (ListMediasResponse) {
    option (google.api.http) = {get: "/api/v1/medias"};
  }

  // ListFeaturedMedias returns a list of featured medias.
  rpc ListFeaturedMedias(ListFeaturedMediasRequest) returns (ListFeaturedMediasResponse) {
    option (google.api.http) = {get: "/api/v1/medias/featured"};
  }

  // ListLatestMedias returns a list of latest medias.
  rpc ListLatestMedias(ListLatestMediasRequest) returns (ListLatestMediasResponse) {
    option (google.api.http) = {get: "/api/v1/medias/latest"};
  }

  // GetMedia returns a media by ID.
  rpc GetMedia(GetMediaRequest) returns (GetMediaResponse) {
    option (google.api.http) = {get: "/api/v1/medias/{id}"};
  }

  // GetMediaVariants returns the available variants for a media.
  rpc GetMediaVariants(GetMediaVariantsRequest) returns (GetMediaVariantsResponse) {
    option (google.api.http) = {get: "/api/v1/medias/{id}/variants"};
  }

  // IncrementViewCount increments the view count of a media.
  rpc IncrementViewCount(IncrementViewCountRequest) returns (IncrementViewCountResponse) {
    option (google.api.http) = {
      post: "/api/v1/medias/{id}/view"
      body: "*"
    };
  }

  // ========== Media Like/Favorite (singular canonical + plural compat) ==========

  // ToggleMediaLike toggles like status for a media (canonical).
  rpc ToggleMediaLike(ToggleMediaLikeRequest) returns (ToggleMediaLikeResponse) {
    option (google.api.http) = {
      post: "/api/v1/medias/{id}/like"
      body: "*"
    };
  }

  // DeleteMediaLike removes like from a media (canonical).
  rpc DeleteMediaLike(DeleteMediaLikeRequest) returns (DeleteMediaLikeResponse) {
    option (google.api.http) = {delete: "/api/v1/medias/{id}/like"};
  }

  // GetMediaLikes returns likes for a media (plural compat).
  rpc GetMediaLikes(GetMediaLikesRequest) returns (GetMediaLikesResponse) {
    option (google.api.http) = {get: "/api/v1/medias/{id}/likes"};
  }

  // ToggleMediaLikeCompat toggles like via plural endpoint (compat).
  rpc ToggleMediaLikeCompat(ToggleMediaLikeRequest) returns (ToggleMediaLikeResponse) {
    option (google.api.http) = {
      post: "/api/v1/medias/{id}/likes"
      body: "*"
    };
  }

  // DeleteMediaLikeCompat removes like via plural endpoint (compat).
  rpc DeleteMediaLikeCompat(DeleteMediaLikeRequest) returns (DeleteMediaLikeResponse) {
    option (google.api.http) = {delete: "/api/v1/medias/{id}/likes"};
  }

  // ToggleMediaFavorite toggles favorite status (canonical).
  rpc ToggleMediaFavorite(ToggleMediaFavoriteRequest) returns (ToggleMediaFavoriteResponse) {
    option (google.api.http) = {
      post: "/api/v1/medias/{id}/favorite"
      body: "*"
    };
  }

  // DeleteMediaFavorite removes favorite (canonical).
  rpc DeleteMediaFavorite(DeleteMediaFavoriteRequest) returns (DeleteMediaFavoriteResponse) {
    option (google.api.http) = {delete: "/api/v1/medias/{id}/favorite"};
  }

  // GetMediaFavorites returns favorites (plural compat).
  rpc GetMediaFavorites(GetMediaFavoritesRequest) returns (GetMediaFavoritesResponse) {
    option (google.api.http) = {get: "/api/v1/medias/{id}/favorites"};
  }

  // ToggleMediaFavoriteCompat toggles via plural (compat).
  rpc ToggleMediaFavoriteCompat(ToggleMediaFavoriteRequest) returns (ToggleMediaFavoriteResponse) {
    option (google.api.http) = {
      post: "/api/v1/medias/{id}/favorites"
      body: "*"
    };
  }

  // DeleteMediaFavoriteCompat removes via plural (compat).
  rpc DeleteMediaFavoriteCompat(DeleteMediaFavoriteRequest) returns (DeleteMediaFavoriteResponse) {
    option (google.api.http) = {delete: "/api/v1/medias/{id}/favorites"};
  }

  // ========== Media Encoding ==========

  // TranscodingStatus returns current transcoding status.
  rpc TranscodingStatus(TranscodingStatusRequest) returns (TranscodingStatusResponse) {
    option (google.api.http) = {get: "/api/v1/medias/transcoding/status"};
  }

  // EncodingTasks returns all encoding tasks.
  rpc EncodingTasks(EncodingTasksRequest) returns (EncodingTasksResponse) {
    option (google.api.http) = {get: "/api/v1/medias/encoding/tasks"};
  }

  // RetryEncodingTask retries a specific task.
  rpc RetryEncodingTask(RetryEncodingTaskRequest) returns (RetryEncodingTaskResponse) {
    option (google.api.http) = {
      post: "/api/v1/medias/encoding/retry"
      body: "*"
    };
  }

  // RetryAllFailedTasks retries all failed tasks.
  rpc RetryAllFailedTasks(RetryAllFailedTasksRequest) returns (RetryAllFailedTasksResponse) {
    option (google.api.http) = {
      post: "/api/v1/medias/encoding/retry-all-failed"
      body: "*"
    };
  }

  // NON-PROTO-SPECIAL: Returns non-JSON content (VTT/JPEG). Requires adapter-level content-type handling.
  // GetMediaSpriteVTT returns the VTT sprite file for a media.
  rpc GetMediaSpriteVTT(GetMediaSpriteVTTRequest) returns (GetMediaSpriteVTTResponse) {
    option (google.api.http) = {get: "/api/v1/medias/{id}/sprite.vtt"};
  }

  // NON-PROTO-SPECIAL: Returns non-JSON content (VTT/JPEG). Requires adapter-level content-type handling.
  // GetMediaSpriteJPG returns the JPG sprite image for a media.
  rpc GetMediaSpriteJPG(GetMediaSpriteJPGRequest) returns (GetMediaSpriteJPGResponse) {
    option (google.api.http) = {get: "/api/v1/medias/{id}/sprite.jpg"};
  }

  // STUB: Not yet implemented. Do not remove - reserved for future development.
  // NON-PROTO-SPECIAL: Returns binary stream. Requires adapter-level handling for file download/streaming.
  rpc GetMediaDownload(GetMediaDownloadRequest) returns (GetMediaDownloadResponse) {
    option (google.api.http) = {get: "/api/v1/medias/{id}/download"};
  }

  // STUB: Not yet implemented. Do not remove - reserved for future development.
  // NON-PROTO-SPECIAL: Returns binary stream. Requires adapter-level handling for file download/streaming.
  rpc GetMediaStream(GetMediaStreamRequest) returns (GetMediaStreamResponse) {
    option (google.api.http) = {get: "/api/v1/medias/{id}/stream"};
  }

  // STUB: Not yet implemented. Do not remove - reserved for future development.
  // NON-PROTO-SPECIAL: Returns non-JSON content (image). Requires adapter-level content-type handling.
  rpc GetMediaThumbnail(GetMediaThumbnailRequest) returns (GetMediaThumbnailResponse) {
    option (google.api.http) = {get: "/api/v1/medias/{id}/thumbnail"};
  }

  // STUB: Not yet implemented. Do not remove - reserved for future development.
  rpc GetMediaSubtitles(GetMediaSubtitlesRequest) returns (GetMediaSubtitlesResponse) {
    option (google.api.http) = {get: "/api/v1/medias/{id}/subtitles"};
  }

  // STUB: Not yet implemented. Do not remove - reserved for future development.
  rpc CreateMediaSubtitle(CreateMediaSubtitleRequest) returns (CreateMediaSubtitleResponse) {
    option (google.api.http) = {
      post: "/api/v1/medias/{id}/subtitles"
      body: "*"
    };
  }

  // STUB: Not yet implemented. Do not remove - reserved for future development.
  rpc GetMediaMetadata(GetMediaMetadataRequest) returns (GetMediaMetadataResponse) {
    option (google.api.http) = {get: "/api/v1/medias/{id}/metadata"};
  }

  // STUB: Not yet implemented. Do not remove - reserved for future development.
  rpc UpdateMedia(UpdateMediaRequest) returns (UpdateMediaResponse) {
    option (google.api.http) = {
      put: "/api/v1/medias/{id}"
      body: "*"
    };
  }

  // STUB: Not yet implemented. Do not remove - reserved for future development.
  rpc DeleteMedia(DeleteMediaRequest) returns (DeleteMediaResponse) {
    option (google.api.http) = {delete: "/api/v1/medias/{id}"};
  }

  // STUB: Not yet implemented. Do not remove - reserved for future development.
  rpc StartMetadataMining(StartMetadataMiningRequest) returns (StartMetadataMiningResponse) {
    option (google.api.http) = {
      post: "/api/v1/medias/{id}/metadata/mining"
      body: "*"
    };
  }
  // STUB: Not yet implemented. Do not remove - reserved for future development.
  rpc GetMetadataMiningStatus(GetMetadataMiningStatusRequest) returns (GetMetadataMiningStatusResponse) {
    option (google.api.http) = {get: "/api/v1/medias/{id}/metadata/status"};
  }
  // STUB: Not yet implemented. Do not remove - reserved for future development.
  rpc GetMediaKeyFrames(GetMediaKeyFramesRequest) returns (GetMediaKeyFramesResponse) {
    option (google.api.http) = {get: "/api/v1/medias/{id}/metadata/key-frames"};
  }
  // STUB: Not yet implemented. Do not remove - reserved for future development.
  rpc GetMediaAudioWaveform(GetMediaAudioWaveformRequest) returns (GetMediaAudioWaveformResponse) {
    option (google.api.http) = {get: "/api/v1/medias/{id}/metadata/audio-waveform"};
  }
  // STUB: Not yet implemented. Do not remove - reserved for future development.
  rpc GetMediaTextContent(GetMediaTextContentRequest) returns (GetMediaTextContentResponse) {
    option (google.api.http) = {get: "/api/v1/medias/{id}/metadata/text-content"};
  }
  // STUB: Not yet implemented. Do not remove - reserved for future development.
  rpc GetMediaSceneChanges(GetMediaSceneChangesRequest) returns (GetMediaSceneChangesResponse) {
    option (google.api.http) = {get: "/api/v1/medias/{id}/metadata/scene-changes"};
  }
  // STUB: Not yet implemented. Do not remove - reserved for future development.
  rpc DeleteSubtitle(DeleteSubtitleRequest) returns (DeleteSubtitleResponse) {
    option (google.api.http) = {delete: "/api/v1/subtitles/{id}"};
  }
  // STUB: Not yet implemented. Do not remove - reserved for future development.
  rpc ListSubtitleLanguages(ListSubtitleLanguagesRequest) returns (ListSubtitleLanguagesResponse) {
    option (google.api.http) = {get: "/api/v1/subtitles/languages"};
  }

  // ReportMedia reports a media for review.
  rpc ReportMedia(ReportMediaRequest) returns (ReportMediaResponse) {
    option (google.api.http) = {
      post: "/api/v1/medias/{id}/report"
      body: "*"
    };
  }

  // GetMediaShares returns share links for a media.
  rpc GetMediaShares(GetMediaSharesRequest) returns (GetMediaSharesResponse) {
    option (google.api.http) = {get: "/api/v1/medias/{id}/shares"};
  }

  // CreateMediaShare records a media share event.
  rpc CreateMediaShare(CreateMediaShareRequest) returns (CreateMediaShareResponse) {
    option (google.api.http) = {
      post: "/api/v1/medias/{id}/shares"
      body: "*"
    };
  }
}

// ========== Encoding Profile Service ==========

service EncodingProfileService {
  // ListEncodeProfiles returns a list of encoding profiles.
  rpc ListEncodeProfiles(ListEncodeProfilesRequest) returns (ListEncodeProfilesResponse) {
    option (google.api.http) = {get: "/api/v1/admin/encoding/profiles"};
  }

  // GetEncodeProfile returns an encoding profile by ID.
  rpc GetEncodeProfile(GetEncodeProfileRequest) returns (GetEncodeProfileResponse) {
    option (google.api.http) = {get: "/api/v1/admin/encoding/profiles/{id}"};
  }

  // CreateEncodeProfile creates a new encoding profile.
  rpc CreateEncodeProfile(CreateEncodeProfileRequest) returns (CreateEncodeProfileResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/encoding/profiles"
      body: "*"
    };
  }

  // UpdateEncodeProfile updates an existing encoding profile.
  rpc UpdateEncodeProfile(UpdateEncodeProfileRequest) returns (UpdateEncodeProfileResponse) {
    option (google.api.http) = {
      put: "/api/v1/admin/encoding/profiles/{profile.id}"
      body: "*"
    };
  }

  // DeleteEncodeProfile deletes an encoding profile.
  rpc DeleteEncodeProfile(DeleteEncodeProfileRequest) returns (DeleteEncodeProfileResponse) {
    option (google.api.http) = {delete: "/api/v1/admin/encoding/profiles/{id}"};
  }

  // PreviewEncodeCommand previews the encoding command.
  rpc PreviewEncodeCommand(PreviewEncodeCommandRequest) returns (PreviewEncodeCommandResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/encoding/profiles/preview"
      body: "*"
    };
  }
}

